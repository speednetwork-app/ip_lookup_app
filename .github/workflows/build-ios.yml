name: iOS Build & Upload

# 两种触发方式：
#   push 到 main  -> 只验证能不能编译过（不签名，快）
#   手动触发      -> 签名构建并上传到 App Store Connect
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: '签名并上传到 App Store Connect'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ---- 以下步骤仅在手动触发且勾选 upload 时执行 ----

      - name: Import signing certificate
        if: inputs.upload
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # 建一个临时钥匙串，构建完就销毁，不污染 runner
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # 允许 codesign 无提示访问私钥，否则 CI 里会卡在授权弹窗
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm /tmp/cert.p12

      - name: Install provisioning profile
        if: inputs.upload
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/dist.mobileprovision

      - name: Build signed IPA
        if: inputs.upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 手动签名必须显式声明 Bundle ID 与描述文件的对应关系，
          # 否则 xcodebuild 不知道该拿哪个 profile 去签。
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.speednetwork.iplookupapp</key>
              <string>IP Lookup App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist

      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" | base64 --decode \
            > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up keychain
        if: always() && inputs.upload
        run: security delete-keychain build.keychain || true

      # 编译验证模式：只确认代码能过编译，产物不签名所以无法上传
      - name: Build unsigned (verification only)
        if: ${{ !inputs.upload }}
        run: flutter build ios --release --no-codesign
